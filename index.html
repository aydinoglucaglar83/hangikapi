<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>HangiKapı</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --mut:#6b7280; --line:#e7e3da;
    --acc:#e2572b; --acc-soft:#fdeee7;
    --ok:#1f9d61; --ok-soft:#e5f6ed; --mid:#c98a06; --mid-soft:#fdf3dc; --bad:#d6383a; --bad-soft:#fde8e8;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}

  /* üst bar */
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
  .bar h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px;flex:1}
  .bar h1 span{color:var(--acc)}
  .back{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:20px;display:none;align-items:center;justify-content:center}
  .bar.inner .back{display:flex}
  .iconbtn{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:17px}

  /* ana ekran */
  .hero{background:var(--ink);color:#fff;border-radius:24px;padding:18px;margin:4px 0 16px}
  .hero .lbl{font-size:13px;opacity:.7}
  .hero .gates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .hero .g{background:rgba(255,255,255,.08);border-radius:14px;padding:10px}
  .hero .g b{display:block;font-size:13px;font-weight:600;opacity:.85}
  .hero .g .m{font-size:22px;font-weight:800;margin-top:4px}
  .hero .g .s{font-size:11px;opacity:.65}
  .hero .note{font-size:13px;opacity:.8;margin-top:10px;line-height:1.4}
  .hero button{margin-top:12px;background:var(--acc);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;border:1px solid var(--line);min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
  .tile .ic{font-size:28px}
  .tile b{font-size:16px}
  .tile small{color:var(--mut);font-size:12.5px;display:block;margin-top:2px}

  /* iç sayfalar */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
  .muted{color:var(--mut);font-size:14px}
  .h2{font-size:20px;font-weight:800;margin:6px 0 2px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list .it:last-child{border-bottom:0}
  .badge{min-width:52px;text-align:center;border-radius:12px;padding:8px 6px;font-weight:800;font-size:13px;background:var(--acc-soft);color:var(--acc);line-height:1.15}
  .badge small{display:block;font-weight:600;font-size:10.5px;opacity:.8}
  .t{font-weight:650}
  .s{color:var(--mut);font-size:13px;margin-top:2px}
  .big{font-size:40px;font-weight:800;letter-spacing:-1px}
  .pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
  .p-ok{background:var(--ok-soft);color:var(--ok)}.p-mid{background:var(--mid-soft);color:var(--mid)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-na{background:#eef0f3;color:var(--mut)}
  .btn{background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font-weight:700;width:100%}
  .btn.acc{background:var(--acc)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .info{background:var(--mid-soft);color:#7a5600;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
  .err{background:var(--bad-soft);color:#8f1f21;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
  .skel{height:56px;border-radius:12px;background:linear-gradient(90deg,#eee 0,#f6f6f6 50%,#eee 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin:8px 0}
  @keyframes sh{to{background-position:-200% 0}}
  .bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:12px}
  .bars div{flex:1;border-radius:4px 4px 0 0;background:var(--acc);opacity:.85;min-height:3px}
  .bars div.low{background:var(--ok)}
  .axis{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:4px}
  .bubble{background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;margin:10px 0;line-height:1.5;white-space:pre-wrap}
  .bubble.me{background:var(--ink);color:#fff;border-radius:18px 18px 6px 18px;margin-left:40px}
  .conv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  details summary{color:var(--mut);font-size:13px;cursor:pointer;margin-top:10px}
  pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#f1efe9;padding:10px;border-radius:10px;max-height:300px;overflow:auto}
  .hide{display:none!important}
  /* haberler */
  .news{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
  .news:last-child{border-bottom:0}
  .news img{width:84px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:#eee}
  .news .t{font-size:15px;line-height:1.3}
  .news .src{font-size:11.5px;color:var(--mut);margin-top:4px}
  /* radar */
  #rmap{height:calc(100vh - 290px);min-height:320px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#dfe6ec}
  .rbase{filter:saturate(.35) brightness(1.05)}
  .rplay{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;font-size:20px;flex:none}
  .rtag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle;background:#eef0f3;color:var(--mut)}
  .rtag.now{background:var(--ok-soft);color:var(--ok)} .rtag.fut{background:var(--acc-soft);color:var(--acc)}
  input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--acc);padding:0;border:0}
  .rlegend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-top:8px}
  .rlegend .bar{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#9be7ff,#3fa9f5,#1d5fd1,#f5d000,#f58a00,#e8001c,#b0007a)}
  .me{width:16px;height:16px;border-radius:50%;background:#1d6ff2;border:3px solid #fff;box-shadow:0 0 0 2px rgba(29,111,242,.35)}
  .leaflet-control-attribution{display:none}
  footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:22px;line-height:1.8}
  footer a{color:var(--mut)}
  a{color:var(--acc)}
</style>
</head>
<body>

<div class="bar" id="bar">
  <button class="back" id="backBtn" aria-label="Geri">←</button>
  <h1 id="title">Hangi<span>Kapı</span></h1>
  <button class="iconbtn" id="setBtn" aria-label="Ayarlar">⚙︎</button>
</div>

<div class="wrap" id="view"></div>

<script>
(() => {
  // ============ AYARLAR ============
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null || v === '' ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const onWorker = /^https?:$/.test(location.protocol) && /workers\.dev$/.test(location.hostname);
  const S = {
    url: onWorker ? location.origin : store.get('hk_url', 'https://hangikapi.aydinoglucaglar83.workers.dev'),
    gates: [] // bulunan kapılar
  };
  const GATES = [
    // nakordoni kapı kodları (17.11.2026'da doğrulandı, hepsi binek araç geçişi)
    { key: 'kapikule', label: 'Kapıkule', ppid: 'id_384', other: 'Kapitan Andreevo 🇧🇬' },
    { key: 'hamzabeyli', label: 'Hamzabeyli', ppid: 'id_386', other: 'Lesovo 🇧🇬' },
    { key: 'derekoy', label: 'Dereköy', ppid: 'id_388', other: 'Malko Tarnovo 🇧🇬' },
    { key: 'ipsala', label: 'İpsala', ppid: 'id_487', other: 'Kipi 🇬🇷' },
    { key: 'pazarkule', label: 'Pazarkule', ppid: 'id_901', other: 'Kastanies 🇬🇷' }
  ];
  const view = document.getElementById('view');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ============ API ============
  let last = 0;
  async function api(path, params) {
    const w = Math.max(0, last + 550 - Date.now()); if (w) await new Promise(r => setTimeout(r, w)); last = Date.now();
    const url = S.url.replace(/\/+$/, '') + '/nk/' + path + (params ? '?' + params : '');
    let res;
    try { res = await fetch(url); } catch (e) { throw friendly('net'); }
    let body; try { body = JSON.parse(await res.text()); } catch (e) { body = {}; }
    if (!res.ok || body.ok === false) {
      const raw = JSON.stringify(body);
      if (/Izin verilmeyen/i.test(raw)) throw friendly('worker');
      if (/approved countr|country.*not.*allowed|outside your/i.test(raw)) throw friendly('country');
      if (res.status === 429 || /limit|quota/i.test(raw)) throw friendly('quota');
      const e = friendly('other'); e.raw = body; throw e;
    }
    return body;
  }
  function friendly(kind) {
    const m = {
      net: 'İnternete ya da sunucuya ulaşılamadı. Bağlantını kontrol edip tekrar dene.',
      worker: 'Sunucu bu bilgiyi henüz geçirmiyor. Birkaç dakika sonra tekrar dene.',
      country: 'Bu bilgi şu an kapalı: nakordoni hesabın yalnızca Türkiye için onaylı. Bulgaristan/Yunanistan onayı gelince açılacak.',
      quota: 'Bugünkü sorgu hakkı doldu. Gece 03:00\'te yenilenir.',
      other: 'Bu bilgi şu an alınamadı.'
    }[kind];
    const e = new Error(m); e.kind = kind; return e;
  }
  const data = b => (b && typeof b === 'object' && 'data' in b) ? b.data : b;
  function walk(o, fn, d = 0) {
    if (d > 8 || !o || typeof o !== 'object') return;
    if (Array.isArray(o)) return o.forEach(x => walk(x, fn, d + 1));
    fn(o); Object.values(o).forEach(v => walk(v, fn, d + 1));
  }
  function pick(o, res) {
    let f; walk(o, x => { if (f !== undefined) return; for (const re of res) for (const [k, v] of Object.entries(x)) if (re.test(k) && v != null && typeof v !== 'object') { f = v; return; } });
    return f;
  }
  function mainArray(o) {
    let best = null;
    walk(o, x => { for (const v of Object.values(x)) if (Array.isArray(v) && v.length && typeof v[0] === 'object' && (!best || v.length > best.length)) best = v; });
    if (!best && Array.isArray(o) && o.length && typeof o[0] === 'object') best = o;
    return best || [];
  }
  // İsim seçimi: önce Türkçe, sonra İngilizce; Bulgarca/Yunanca (yerel dil) en son
  const NONLATIN = /[\u0370-\u03FF\u0400-\u04FF]/;
  function pickLang(n) {
    if (!n || typeof n !== 'object') return n;
    const tr = n.tr || n.TR || n.turkish;
    if (tr) return tr;
    const t = n.translations;
    if (t) {
      if (Array.isArray(t)) { const x = t.find(e => /^tr/i.test(e.lang || e.language || e.code || '')); if (x) return x.text || x.name || x.value; }
      else if (typeof t === 'object') { const x = t.tr || t.TR; if (x) return typeof x === 'object' ? (x.name || x.text) : x; }
    }
    if (Array.isArray(n)) { const x = n.find(e => /^tr/i.test(e.language || e.lang || '')) || n.find(e => /^en/i.test(e.language || e.lang || '')); if (x) return x.text || x.name; }
    const vals = Object.values(n).filter(v => typeof v === 'string');
    return n.en || n.english || vals.find(v => !NONLATIN.test(v)) || n.local || vals[0];
  }
  const nameOf = o => { const n = o.name_tr ?? o.name ?? o.name_en ?? o.title ?? o.city ?? o.label; const r = typeof n === 'object' && n ? pickLang(n) : n; return (typeof r === 'string' && NONLATIN.test(r) && o.name_en) ? o.name_en : r; };
  const isoIn = o => { let f; walk(o, x => { if (f) return; for (const v of Object.values(x)) if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v)) { f = v; return; } }); if (!f && typeof o.date === 'string') f = o.date; return f; };
  const trDate = (iso, opt) => { const d = new Date(iso.slice(0, 10) + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('tr-TR', opt || { day: 'numeric', month: 'long', weekday: 'long' }); };
  const fmtMin = m => m == null ? '—' : (m = Math.round(m)) < 60 ? m + ' dk' : Math.floor(m / 60) + ' sa' + (m % 60 ? ' ' + (m % 60) + ' dk' : '');
  const level = m => m == null ? ['p-na', 'bilinmiyor'] : m < 30 ? ['p-ok', 'sakin'] : m < 90 ? ['p-mid', 'orta'] : ['p-bad', 'yoğun'];
  const skel = (n = 3) => Array(n).fill('<div class="skel"></div>').join('');
  const errBox = e => '<div class="' + (e.kind === 'country' ? 'info' : 'err') + '">' + esc(e.message) + '</div>' +
    (e.raw ? '<details><summary>Teknik ayrıntı</summary><pre>' + esc(JSON.stringify(e.raw, null, 2)) + '</pre></details>' : '');
  // Binek araç (car/passenger) alt nesnesini bul; yoksa genel veriyi kullan
  const CAR_RE = /^(car|cars|passenger|passengers|passenger_cars?|light|auto|automobile|vehicle_1|type_1|1|легков\S*)$/i;
  const NONCAR_RE = /truck|lorry|bus|cargo|freight|heavy|автобус|вантаж/i;
  function carPart(o) {
    let f = null;
    walk(o, x => { if (f) return; for (const [k, v] of Object.entries(x)) if (CAR_RE.test(k) && v && typeof v === 'object') { f = v; return; } });
    if (f) return { part: f, car: true };
    walk(o, x => { if (f) return; for (const v of Object.values(x)) if (Array.isArray(v)) {
      const c = v.find(i => i && typeof i === 'object' && Object.entries(i).some(([k, val]) => /vehicle|type|category/i.test(k) && /car|passenger|легков|auto/i.test(String(val))));
      if (c) { f = c; return; } } });
    return f ? { part: f, car: true } : { part: o, car: false };
  }
  // nakordoni v4: { data:[geçmiş], snapshot:{ queue_now, wait_min, age_min, updated_at } }
  function snapOf(d) {
    let s = null;
    walk(d, o => { if (!s && ('wait_min' in o || 'queue_now' in o)) s = o; });
    return s;
  }
  const ageText = s => s && s.age_min != null && !isNaN(+s.age_min)
    ? (+s.age_min < 60 ? Math.round(s.age_min) + ' dk önce güncellendi' : Math.floor(s.age_min / 60) + ' sa ' + Math.round(s.age_min % 60) + ' dk önce güncellendi') : '';
  function waitOf(q) {
    for (const [re, f] of [[/^car_?wait/i, 1], [/^wait_?min/i, 1], [/wait.*min/i, 1], [/wait.*hour/i, 60], [/wait.*sec/i, 1 / 60], [/^wait$|wait_?time|estimated_?wait/i, 1]]) {
      const v = pick(q, [re]); if (v != null && !isNaN(+v)) return +v * f;
    }
    return null;
  }

  // ============ YÖNLENDİRME ============
  const PAGES = {};
  let curPage = null;
  function go(name, push = true) {
    if (curPage && PAGES[curPage] && PAGES[curPage].leave) PAGES[curPage].leave();
    const p = PAGES[name] || PAGES.home;
    curPage = PAGES[name] ? name : 'home';
    document.getElementById('bar').classList.toggle('inner', name !== 'home');
    document.getElementById('title').innerHTML = name === 'home' ? 'Hangi<span>Kapı</span>' : esc(p.title);
    if (push) history.pushState({ p: name }, '', name === 'home' ? location.pathname + location.search : '#' + name);
    window.scrollTo(0, 0);
    p.render();
  }
  window.addEventListener('popstate', e => go((e.state && e.state.p) || location.hash.slice(1) || 'home', false));
  document.getElementById('backBtn').onclick = () => history.length > 1 ? history.back() : go('home');
  document.getElementById('setBtn').onclick = () => go('settings');
  const footer = '<footer><a href="https://nakordoni.eu" target="_blank" rel="noopener">Data by nakordoni.eu</a><br>' +
    '<a href="#" id="dl">⬇︎ Bu uygulamayı indir</a><br><span style="font-size:11px;opacity:.7">Sürüm 19 · 17.11.2026</span></footer>';
  function bindFooter() {
    const a = document.getElementById('dl'); if (!a) return;
    a.onclick = ev => { ev.preventDefault(); const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob([SOURCE], { type: 'text/html' })); l.download = 'hangikapi.html'; document.body.appendChild(l); l.click(); l.remove(); };
  }

  // ============ KAPILARI BUL ============
  // Kapı kodları sabit: isim aramasına ve ekstra sorguya gerek yok
  async function findGates() {
    if (!S.gates.length) S.gates = GATES.map(g => ({ ppid: g.ppid, label: g.label, key: g.key, other: g.other, car: true }));
    return S.gates;
  }

  // ============ ANA EKRAN ============
  PAGES.home = {
    render() {
      view.innerHTML =
        '<div class="hero" id="hero"><div class="lbl">🚗 Binek araç · Trakya sınır kapıları · şu an</div><div id="heroBody">' + '<div class="gates">' +
        GATES.slice(0, 3).map(g => '<div class="g"><b>' + g.label + '</b><div class="m">…</div><div class="s">yükleniyor</div></div>').join('') + '</div></div>' +
        '<button id="heroBtn">Detaylar →</button></div>' +
        '<div class="tiles">' +
        tile('fx', '💱', 'Döviz', 'Euro kurları, çevirici') +
        tile('holidays', '📅', 'Tatiller', 'Resmi tatiller, geri sayım') +
        tile('fuel', '⛽', 'Akaryakıt', 'Ülkelere göre fiyatlar') +
        tile('tolls', '🛣', 'Vinyet ve otoyol', 'Ülkelere göre ücretler') +
        tile('ask', '🤖', 'Asistana sor', 'Sınırla ilgili her şey') +
        tile('gates', '🚧', 'Kapılar', 'Bekleme, tahmin, en iyi saat') +
        '<button class="tile" data-p="aanews" style="grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px"><span class="ic">📰</span><span><b>Son dakika</b><small>Anadolu Ajansı · güncel, ekonomi, dünya, spor…</small></span></button>' +
        '<button class="tile" data-p="avnews" style="grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px"><span class="ic">✈️</span><span><b>Havacılık haberleri</b><small>AirportHaber, Havayolu101, Simple Flying, AeroTime</small></span></button>' +
        '<button class="tile" data-p="radar" style="grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px"><span class="ic">🌧</span><span><b>Yağış radarı</b><small>Canlı yağmur haritası, son 2 saat</small></span></button>' +
        '</div>' + footer;
      view.querySelectorAll('.tile').forEach(t => t.onclick = () => go(t.dataset.p));
      document.getElementById('heroBtn').onclick = () => go('gates');
      bindFooter();
      heroLoad();
    }
  };
  const tile = (p, ic, t, s) => '<button class="tile" data-p="' + p + '"><span class="ic">' + ic + '</span><span><b>' + t + '</b><small>' + s + '</small></span></button>';
  async function heroLoad() {
    const box = document.getElementById('heroBody'); if (!box) return;
    try {
      const gates = await findGates();
      if (!gates.length) { box.innerHTML = '<div class="note">Bu kapılar nakordoni\'de bulunamadı.</div>'; return; }
      const cells = [];
      for (const g of gates.slice(0, 3)) {
        try { const b = await api('v4/data/queue', 'ppid=' + g.ppid); const d = data(b); const sn = snapOf(b); const m = sn && sn.wait_min != null ? +sn.wait_min : waitOf(carPart(d).part); g.wait = m; cells.push([g.label, fmtMin(m), level(m)[1]]); }
        catch (e) { cells.push([g.label, '—', 'veri yok']); }
      }
      if (document.getElementById('heroBody') !== box) return;
      box.innerHTML = '<div class="gates">' + cells.map(c => '<div class="g"><b>' + esc(c[0]) + '</b><div class="m">' + esc(c[1]) + '</div><div class="s">' + esc(c[2]) + '</div></div>').join('') + '</div>';
    } catch (e) {

      '<div class="grow"><div class="t">' + esc(x.title) + '</div><div class="src">' + (x.t ? ago(x.t) : '') + (x.desc ? ' · ' + esc(x.desc.slice(0, 90)) + (x.desc.length > 90 ? '…' : '') : '') + '</div></div></a>').join('')
      : '<div class="muted">Haber bulunamadı.</div>';
    const info = document.getElementById('aainfo'); if (info) info.textContent = 'Son yenileme: ' + new Date(t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }

  // ============ YAĞIŞ RADARI (RainViewer) ============
  let leafletP = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletP) return leafletP;
    leafletP = new Promise((res, rej) => {
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
      const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = res; s.onerror = () => { leafletP = null; rej(); }; document.head.appendChild(s);
    });
    return leafletP;
  }
  const R = { map: null, frames: [], nowIdx: 0, layers: {}, cur: -1, host: '', play: null, refresh: null, me: null };
  PAGES.radar = {
    title: 'Yağış radarı',
    async render() {
      view.innerHTML =
        '<div id="rmap"></div>' +
        '<div class="card" style="margin-top:10px"><div class="row"><button class="rplay" id="rplay">▶</button>' +
        '<div class="grow"><div style="font-size:22px;font-weight:800"><span id="rtime">--:--</span><span class="rtag" id="rtag">…</span></div>' +
        '<div class="muted" style="font-size:12.5px" id="rsub">yükleniyor…</div></div>' +
        '<button class="iconbtn" id="rloc" aria-label="Konumum">📍</button></div>' +
        '<input type="range" id="rslider" min="0" max="0" value="0">' +
        '<div class="rlegend"><span>hafif</span><div class="bar"></div><span>şiddetli</span></div>' +
        '<div class="muted" style="font-size:11px;margin-top:6px">Weather data by <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div></div>' + footer;
      bindFooter();
      try { await loadLeaflet(); } catch (e) { document.getElementById('rmap').innerHTML = '<div class="err" style="margin:12px">Harita yüklenemedi. İnterneti kontrol edip tekrar dene.</div>'; return; }
      if (!document.getElementById('rmap')) return; // kullanıcı sayfadan çıktı
      R.map = L.map('rmap', { zoomControl: false, minZoom: 3, maxZoom: 12 }).setView([41.02, 29.0], 7);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, className: 'rbase' }).addTo(R.map);
      R.layers = {}; R.cur = -1; R.me = null;
      const sl = document.getElementById('rslider');
      sl.oninput = () => { rPlay(false); rShow(+sl.value); };
      document.getElementById('rplay').onclick = () => rPlay(!R.play);
      document.getElementById('rloc').onclick = () => {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(p => {
          const ll = [p.coords.latitude, p.coords.longitude];
          if (R.me) R.me.setLatLng(ll); else R.me = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [16, 16] }) }).addTo(R.map);
          R.map.setView(ll, 9);
        }, () => { document.getElementById('rsub').textContent = 'Konum alınamadı, tarayıcıda konum iznini aç.'; }, { timeout: 10000 });
      };
      await rLoad();
      R.refresh = setInterval(rLoad, 5 * 60 * 1000);
    },
    leave() { rPlay(false); clearInterval(R.refresh); R.refresh = null; if (R.map) { R.map.remove(); R.map = null; } }
  };
  const rFmt = ts => new Date(ts * 1000).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  function rLayer(i) {
    const f = R.frames[i];
    if (!R.layers[f.path]) R.layers[f.path] = L.tileLayer(R.host + f.path + '/256/{z}/{x}/{y}/2/1_1.png', { opacity: 0, zIndex: 10, maxNativeZoom: 7, maxZoom: 12 });
    return R.layers[f.path];
  }
  function rShow(i) {
    if (!R.map || !R.frames.length) return;
    i = (i + R.frames.length) % R.frames.length;
    const lay = rLayer(i); if (!R.map.hasLayer(lay)) lay.addTo(R.map); lay.setOpacity(0.75);
    if (R.cur >= 0 && R.cur !== i) rLayer(R.cur).setOpacity(0);
    const pre = rLayer((i + 1) % R.frames.length); if (!R.map.hasLayer(pre)) pre.addTo(R.map);
    R.cur = i;
    const sl = document.getElementById('rslider'); if (sl) sl.value = i;
    const f = R.frames[i], d = Math.round((f.time - R.frames[R.nowIdx].time) / 60), tag = document.getElementById('rtag');
    document.getElementById('rtime').textContent = rFmt(f.time);
    if (i === R.nowIdx) { tag.className = 'rtag now'; tag.textContent = 'şimdi'; }
    else if (i > R.nowIdx) { tag.className = 'rtag fut'; tag.textContent = 'tahmin +' + d + ' dk'; }
    else { tag.className = 'rtag'; tag.textContent = d + ' dk'; }
  }
  function rPlay(on) {
    clearInterval(R.play); R.play = null;
    const b = document.getElementById('rplay'); if (b) b.textContent = on ? '❚❚' : '▶';
    if (on) R.play = setInterval(() => rShow(R.cur + 1), 700);
  }
  async function rLoad() {
    try {
      const d = await (await fetch('https://api.rainviewer.com/public/weather-maps.json', { cache: 'no-store' })).json();
      if (!R.map) return;
      const past = (d.radar && d.radar.past) || [], nc = (d.radar && d.radar.nowcast) || [];
      if (!past.length) throw 0;
      Object.values(R.layers).forEach(l => R.map.removeLayer(l)); R.layers = {}; R.cur = -1;
      R.host = d.host; R.frames = past.concat(nc); R.nowIdx = past.length - 1;
      document.getElementById('rslider').max = R.frames.length - 1;
      document.getElementById('rsub').textContent = 'Güncelleme: ' + rFmt(d.generated) + (nc.length ? ' · 30 dk tahmin dahil' : ' · son 2 saat');
      rShow(R.nowIdx);
    } catch (e) { const s = document.getElementById('rsub'); if (s) s.textContent = 'Radar verisi alınamadı, biraz sonra tekrar dene.'; }
  }

  // ============ İBB BAĞLANTI TESTİ (telefondan doğrudan) ============
  PAGES.ibbtest = {
    title: 'İBB bağlantı testi',
    async render() {
      view.innerHTML = '<div class="card"><div class="t">Telefonundan İBB servislerine doğrudan erişim test ediliyor…</div><div id="ibbout" style="margin-top:10px">' + skel(3) + '</div></div>' + footer;
      bindFooter();
      const out = [];
      const tryFetch = async (label, url) => {
        const t0 = Date.now();
        try {
          const r = await fetch(url, { cache: 'no-store' });
          const txt = await r.text();
          let j = null; try { j = JSON.parse(txt); } catch (e) {}
          const colo = r.headers.get('X-Colo') || (j && j.colo) || '';
          return { label, ok: r.ok, status: r.status + (colo ? ' · merkez ' + colo : '') + (j && j.detail ? ' · ' + j.detail.slice(0, 60) : ''), ms: Date.now() - t0, j, txt };
        } catch (e) { return { label, ok: false, status: 'CORS/ağ engeli', ms: Date.now() - t0, err: e.message }; }
      };
      const ckan = await tryFetch('İBB açık veri (CKAN)', S.url.replace(/\/+$/, '') + '/ibb/ckan/package_search?q=hal&rows=1');
      out.push('<div class="it"><b>' + (ckan.ok ? '✅' : '❌') + ' ' + ckan.label + '</b><div class="s">Durum: ' + esc(ckan.status) + ' · ' + ckan.ms + ' ms</div></div>');
      let spec = null, specUrl = '';
      const HB = S.url.replace(/\/+$/, '') + '/ibb/hal/';
      for (const u of [HB + 'swagger/docs/v1', HB + 'swagger/v1/swagger.json', HB + 'swagger.json']) {
        const r = await tryFetch('Hal fiyatları servisi', u);
        out.push('<div class="it"><b>' + (r.ok && r.j ? '✅' : '❌') + ' Hal servisi şeması</b><div class="s">' + esc(u.replace(HB, '/')) + ' → ' + esc(r.status) + ' · ' + r.ms + ' ms</div></div>');
        if (r.ok && r.j && r.j.paths) { spec = r.j; specUrl = u; break; }
      }
      let html = '<div class="list">' + out.join('') + '</div>';
      if (spec) {
        html += '<div class="t" style="margin-top:14px">Hal servisinin adresleri (' + Object.keys(spec.paths).length + ')</div><div class="list">';
        for (const [p, ops] of Object.entries(spec.paths)) {
          for (const [m, op] of Object.entries(ops)) {
            const params = (op.parameters || []).map(x => x.name + (x.required ? '*' : '')).join(', ');
            html += '<div class="it"><div class="grow"><div class="t" style="font-family:ui-monospace,monospace;font-size:12.5px">' + esc(m.toUpperCase() + ' ' + p) + '</div><div class="s">' + esc(op.summary || op.operationId || '') + (params ? ' · parametreler: ' + esc(params) : '') + '</div></div></div>';
          }
        }
        html += '</div><div class="muted" style="font-size:11px;margin-top:8px">Base: ' + esc((spec.host || '') + (spec.basePath || '')) + '</div>';
      } else {
        html += '<div class="info" style="margin-top:12px">Şema okunamadı. Ekranın görüntüsünü Claude\'a gönder.</div>';
      }
      document.getElementById('ibbout').innerHTML = html;
    }
  };

  // ============ AYARLAR ============
  PAGES.settings = {
    title: 'Ayarlar',
    render() {
      view.innerHTML = '<div class="card"><div class="t">Sunucu adresi</div><div class="muted" style="margin:4px 0 10px">Genelde değiştirmen gerekmez.</div>' +
        '<input id="url" value="' + esc(S.url) + '"' + (onWorker ? ' disabled' : '') + '>' +
        '<div style="margin-top:12px;display:grid;gap:8px"><button class="btn" id="save">Kaydet</button><button class="btn ghost" id="test">Bağlantıyı test et</button></div><div id="tout" class="muted" style="margin-top:10px"></div></div>' +
        '<div class="card"><div class="t">Kota</div><div id="usage" class="muted" style="margin-top:6px">…</div></div>' + footer;
      bindFooter();
      document.getElementById('save').onclick = () => { S.url = document.getElementById('url').value.trim() || S.url; store.set('hk_url', S.url); S.gates = []; go('home'); };
      document.getElementById('test').onclick = async () => {
        const o = document.getElementById('tout'); o.textContent = 'deneniyor…';
        try { const s = data(await api('v4/data/status')).summary; o.textContent = '✅ Bağlı' + (s ? ' · ' + s.online + '/' + s.total + ' servis çalışıyor' : ''); } catch (e) { o.textContent = '❌ ' + e.message; }
      };
      api('v2/account/usage').then(b => {
        const u = b.usage || data(b); const used = pick(u, [/^used$/i]), lim = pick(u, [/^limit$/i]);
        document.getElementById('usage').textContent = used != null ? 'Bugün ' + used + ' / ' + lim + ' sorgu kullanıldı. Gece 03:00\'te sıfırlanır.' : 'Bilgi alınamadı.';
      }).catch(e => { const el = document.getElementById('usage'); if (el) el.textContent = e.message; });
    }
  };

  const SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  go(location.hash.slice(1) || 'home', false);
  history.replaceState({ p: location.hash.slice(1) || 'home' }, '');
})();
</script>
</body>
