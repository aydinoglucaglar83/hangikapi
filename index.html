<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>HangiKapı</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1d2433; --mut:#6b7280; --line:#e7e3da;
    --acc:#e2572b; --acc-soft:#fdeee7;
    --ok:#1f9d61; --ok-soft:#e5f6ed; --mid:#c98a06; --mid-soft:#fdf3dc; --bad:#d6383a; --bad-soft:#fde8e8;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}

  /* üst bar */
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
  .bar h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px;flex:1}
  .bar h1 span{color:var(--acc)}
  .back{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:20px;display:none;align-items:center;justify-content:center}
  .bar.inner .back{display:flex}
  .iconbtn{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:17px}

  /* ana ekran */
  .hero{background:var(--ink);color:#fff;border-radius:24px;padding:18px;margin:4px 0 16px}
  .hero .lbl{font-size:13px;opacity:.7}
  .hero .gates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .hero .g{background:rgba(255,255,255,.08);border-radius:14px;padding:10px}
  .hero .g b{display:block;font-size:13px;font-weight:600;opacity:.85}
  .hero .g .m{font-size:22px;font-weight:800;margin-top:4px}
  .hero .g .s{font-size:11px;opacity:.65}
  .hero .note{font-size:13px;opacity:.8;margin-top:10px;line-height:1.4}
  .hero button{margin-top:12px;background:var(--acc);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--card);border-radius:var(--r);padding:16px;text-align:left;border:1px solid var(--line);min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
  .tile .ic{font-size:28px}
  .tile b{font-size:16px}
  .tile small{color:var(--mut);font-size:12.5px;display:block;margin-top:2px}

  /* iç sayfalar */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
  .muted{color:var(--mut);font-size:14px}
  .h2{font-size:20px;font-weight:800;margin:6px 0 2px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .list .it{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .list .it:last-child{border-bottom:0}
  .badge{min-width:52px;text-align:center;border-radius:12px;padding:8px 6px;font-weight:800;font-size:13px;background:var(--acc-soft);color:var(--acc);line-height:1.15}
  .badge small{display:block;font-weight:600;font-size:10.5px;opacity:.8}
  .t{font-weight:650}
  .s{color:var(--mut);font-size:13px;margin-top:2px}
  .big{font-size:40px;font-weight:800;letter-spacing:-1px}
  .pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
  .p-ok{background:var(--ok-soft);color:var(--ok)}.p-mid{background:var(--mid-soft);color:var(--mid)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-na{background:#eef0f3;color:var(--mut)}
  .btn{background:var(--ink);color:#fff;border-radius:14px;padding:13px 16px;font-weight:700;width:100%}
  .btn.acc{background:var(--acc)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .info{background:var(--mid-soft);color:#7a5600;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
  .err{background:var(--bad-soft);color:#8f1f21;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
  .skel{height:56px;border-radius:12px;background:linear-gradient(90deg,#eee 0,#f6f6f6 50%,#eee 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin:8px 0}
  @keyframes sh{to{background-position:-200% 0}}
  .bars{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:12px}
  .bars div{flex:1;border-radius:4px 4px 0 0;background:var(--acc);opacity:.85;min-height:3px}
  .bars div.low{background:var(--ok)}
  .axis{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-top:4px}
  .bubble{background:#fff;border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px;margin:10px 0;line-height:1.5;white-space:pre-wrap}
  .bubble.me{background:var(--ink);color:#fff;border-radius:18px 18px 6px 18px;margin-left:40px}
  .conv{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  details summary{color:var(--mut);font-size:13px;cursor:pointer;margin-top:10px}
  pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#f1efe9;padding:10px;border-radius:10px;max-height:300px;overflow:auto}
  .hide{display:none!important}
  footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:22px;line-height:1.8}
  footer a{color:var(--mut)}
  a{color:var(--acc)}
</style>
</head>
<body>

<div class="bar" id="bar">
  <button class="back" id="backBtn" aria-label="Geri">←</button>
  <h1 id="title">Hangi<span>Kapı</span></h1>
  <button class="iconbtn" id="setBtn" aria-label="Ayarlar">⚙︎</button>
</div>

<div class="wrap" id="view"></div>

<script>
(() => {
  // ============ AYARLAR ============
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null || v === '' ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const onWorker = /^https?:$/.test(location.protocol) && /workers\.dev$/.test(location.hostname);
  const S = {
    url: onWorker ? location.origin : store.get('hk_url', 'https://hangikapi.aydinoglucaglar83.workers.dev'),
    gates: [] // bulunan kapılar
  };
  const GATES = [
    { key: 'kapikule', label: 'Kapıkule', terms: ['kapikule', 'kapitan andreevo', 'andreevo'] },
    { key: 'hamzabeyli', label: 'Hamzabeyli', terms: ['hamzabeyli', 'lesovo'] },
    { key: 'derekoy', label: 'Dereköy', terms: ['derekoy', 'malko tarnovo'] },
    { key: 'ipsala', label: 'İpsala', terms: ['ipsala', 'kipoi', 'kipi'] },
    { key: 'pazarkule', label: 'Pazarkule', terms: ['pazarkule', 'kastanies'] }
  ];
  const view = document.getElementById('view');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ============ API ============
  let last = 0;
  async function api(path, params) {
    const w = Math.max(0, last + 550 - Date.now()); if (w) await new Promise(r => setTimeout(r, w)); last = Date.now();
    const url = S.url.replace(/\/+$/, '') + '/nk/' + path + (params ? '?' + params : '');
    let res;
    try { res = await fetch(url); } catch (e) { throw friendly('net'); }
    let body; try { body = JSON.parse(await res.text()); } catch (e) { body = {}; }
    if (!res.ok || body.ok === false) {
      const raw = JSON.stringify(body);
      if (/Izin verilmeyen/i.test(raw)) throw friendly('worker');
      if (/approved countr|country.*not.*allowed|outside your/i.test(raw)) throw friendly('country');
      if (res.status === 429 || /limit|quota/i.test(raw)) throw friendly('quota');
      const e = friendly('other'); e.raw = body; throw e;
    }
    return body;
  }
  function friendly(kind) {
    const m = {
      net: 'İnternete ya da sunucuya ulaşılamadı. Bağlantını kontrol edip tekrar dene.',
      worker: 'Sunucu bu bilgiyi henüz geçirmiyor. Birkaç dakika sonra tekrar dene.',
      country: 'Bu bilgi şu an kapalı: nakordoni hesabın yalnızca Türkiye için onaylı. Bulgaristan/Yunanistan onayı gelince açılacak.',
      quota: 'Bugünkü sorgu hakkı doldu. Gece 03:00\'te yenilenir.',
      other: 'Bu bilgi şu an alınamadı.'
    }[kind];
    const e = new Error(m); e.kind = kind; return e;
  }
  const data = b => (b && typeof b === 'object' && 'data' in b) ? b.data : b;
  function walk(o, fn, d = 0) {
    if (d > 8 || !o || typeof o !== 'object') return;
    if (Array.isArray(o)) return o.forEach(x => walk(x, fn, d + 1));
    fn(o); Object.values(o).forEach(v => walk(v, fn, d + 1));
  }
  function pick(o, res) {
    let f; walk(o, x => { if (f !== undefined) return; for (const re of res) for (const [k, v] of Object.entries(x)) if (re.test(k) && v != null && typeof v !== 'object') { f = v; return; } });
    return f;
  }
  function mainArray(o) {
    let best = null;
    walk(o, x => { for (const v of Object.values(x)) if (Array.isArray(v) && v.length && typeof v[0] === 'object' && (!best || v.length > best.length)) best = v; });
    if (!best && Array.isArray(o) && o.length && typeof o[0] === 'object') best = o;
    return best || [];
  }
  const nameOf = o => { const n = o.name_tr ?? o.name ?? o.name_en ?? o.title ?? o.city ?? o.label; return typeof n === 'object' && n ? (n.tr || n.local || n.en || Object.values(n).find(v => typeof v === 'string')) : n; };
  const isoIn = o => { let f; walk(o, x => { if (f) return; for (const v of Object.values(x)) if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v)) { f = v; return; } }); if (!f && typeof o.date === 'string') f = o.date; return f; };
  const trDate = (iso, opt) => { const d = new Date(iso.slice(0, 10) + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('tr-TR', opt || { day: 'numeric', month: 'long', weekday: 'long' }); };
  const fmtMin = m => m == null ? '—' : (m = Math.round(m)) < 60 ? m + ' dk' : Math.floor(m / 60) + ' sa' + (m % 60 ? ' ' + (m % 60) + ' dk' : '');
  const level = m => m == null ? ['p-na', 'bilinmiyor'] : m < 30 ? ['p-ok', 'sakin'] : m < 90 ? ['p-mid', 'orta'] : ['p-bad', 'yoğun'];
  const skel = (n = 3) => Array(n).fill('<div class="skel"></div>').join('');
  const errBox = e => '<div class="' + (e.kind === 'country' ? 'info' : 'err') + '">' + esc(e.message) + '</div>' +
    (e.raw ? '<details><summary>Teknik ayrıntı</summary><pre>' + esc(JSON.stringify(e.raw, null, 2)) + '</pre></details>' : '');
  // Binek araç (car/passenger) alt nesnesini bul; yoksa genel veriyi kullan
  const CAR_RE = /^(car|cars|passenger|passengers|passenger_cars?|light|auto|automobile|vehicle_1|type_1|1|легков\S*)$/i;
  const NONCAR_RE = /truck|lorry|bus|cargo|freight|heavy|автобус|вантаж/i;
  function carPart(o) {
    let f = null;
    walk(o, x => { if (f) return; for (const [k, v] of Object.entries(x)) if (CAR_RE.test(k) && v && typeof v === 'object') { f = v; return; } });
    if (f) return { part: f, car: true };
    walk(o, x => { if (f) return; for (const v of Object.values(x)) if (Array.isArray(v)) {
      const c = v.find(i => i && typeof i === 'object' && Object.entries(i).some(([k, val]) => /vehicle|type|category/i.test(k) && /car|passenger|легков|auto/i.test(String(val))));
      if (c) { f = c; return; } } });
    return f ? { part: f, car: true } : { part: o, car: false };
  }
  function waitOf(q) {
    for (const [re, f] of [[/^car_?wait/i, 1], [/^wait_?min/i, 1], [/wait.*min/i, 1], [/wait.*hour/i, 60], [/wait.*sec/i, 1 / 60], [/^wait$|wait_?time|estimated_?wait/i, 1]]) {
      const v = pick(q, [re]); if (v != null && !isNaN(+v)) return +v * f;
    }
    return null;
  }

  // ============ YÖNLENDİRME ============
  const PAGES = {};
  function go(name, push = true) {
    const p = PAGES[name] || PAGES.home;
    document.getElementById('bar').classList.toggle('inner', name !== 'home');
    document.getElementById('title').innerHTML = name === 'home' ? 'Hangi<span>Kapı</span>' : esc(p.title);
    if (push) history.pushState({ p: name }, '', name === 'home' ? location.pathname + location.search : '#' + name);
    window.scrollTo(0, 0);
    p.render();
  }
  window.addEventListener('popstate', e => go((e.state && e.state.p) || location.hash.slice(1) || 'home', false));
  document.getElementById('backBtn').onclick = () => history.length > 1 ? history.back() : go('home');
  document.getElementById('setBtn').onclick = () => go('settings');
  const footer = '<footer><a href="https://nakordoni.eu" target="_blank" rel="noopener">Data by nakordoni.eu</a><br>' +
    '<a href="#" id="dl">⬇︎ Bu uygulamayı indir</a></footer>';
  function bindFooter() {
    const a = document.getElementById('dl'); if (!a) return;
    a.onclick = ev => { ev.preventDefault(); const l = document.createElement('a'); l.href = URL.createObjectURL(new Blob([SOURCE], { type: 'text/html' })); l.download = 'hangikapi.html'; document.body.appendChild(l); l.click(); l.remove(); };
  }

  // ============ KAPILARI BUL ============
  async function findGates() {
    if (S.gates.length) return S.gates;
    const terms = GATES.flatMap(g => g.terms);
    const out = [];
    const take = (o, id) => {
      const txt = JSON.stringify(o).toLowerCase();
      const g = GATES.find(g => g.terms.some(t => txt.includes(t)));
      if (g && !out.some(x => x.ppid === id)) out.push({ ppid: id, label: g.label, key: g.key });
    };
    const scan = body => walk(body, o => {
      const id = o.ppid ?? (typeof o.id === 'string' && /^id_\d+$/.test(o.id) ? o.id : null);
      if (id) take(o, String(id));
      for (const [k, v] of Object.entries(o)) if (/^id_\d+$/.test(k) && v && typeof v === 'object') take(v, k);
    });
    const s = await api('v1/data/search', 'name=' + encodeURIComponent(terms.slice(0, 20).join(',')) + '&lang=en');
    scan(s);
    if (!out.length) {
      const all = await api('v1/data/checkpoints');
      scan(all);
      if (!out.length && /outside your approved countries/i.test(JSON.stringify(all))) throw friendly('country');
    }
    out.sort((a, b) => GATES.findIndex(g => g.key === a.key) - GATES.findIndex(g => g.key === b.key));
    S.gates = out;
    return out;
  }

  // ============ ANA EKRAN ============
  PAGES.home = {
    render() {
      view.innerHTML =
        '<div class="hero" id="hero"><div class="lbl">🚗 Binek araç · Trakya sınır kapıları · şu an</div><div id="heroBody">' + '<div class="gates">' +
        GATES.slice(0, 3).map(g => '<div class="g"><b>' + g.label + '</b><div class="m">…</div><div class="s">yükleniyor</div></div>').join('') + '</div></div>' +
        '<button id="heroBtn">Detaylar →</button></div>' +
        '<div class="tiles">' +
        tile('fx', '💱', 'Döviz', 'Euro kurları, çevirici') +
        tile('holidays', '📅', 'Tatiller', 'Resmi tatiller, geri sayım') +
        tile('fuel', '⛽', 'Akaryakıt', 'Ülkelere göre fiyatlar') +
        tile('tolls', '🛣', 'Vinyet ve otoyol', 'Ülkelere göre ücretler') +
        tile('ask', '🤖', 'Asistana sor', 'Sınırla ilgili her şey') +
        tile('gates', '🚧', 'Kapılar', 'Bekleme, tahmin, en iyi saat') +
        '<a class="tile" style="grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px;text-decoration:none;color:inherit" href="' + (onWorker ? 'https://aydinoglucaglar83.github.io/hangikapi/radar.html' : 'radar.html') + '"><span class="ic">🌧</span><span><b>Yağış radarı</b><small>Canlı yağmur haritası, son 2 saat</small></span></a>' +
        '</div>' + footer;
      view.querySelectorAll('.tile').forEach(t => t.onclick = () => go(t.dataset.p));
      document.getElementById('heroBtn').onclick = () => go('gates');
      bindFooter();
      heroLoad();
    }
  };
  const tile = (p, ic, t, s) => '<button class="tile" data-p="' + p + '"><span class="ic">' + ic + '</span><span><b>' + t + '</b><small>' + s + '</small></span></button>';
  async function heroLoad() {
    const box = document.getElementById('heroBody'); if (!box) return;
    try {
      const gates = await findGates();
      if (!gates.length) { box.innerHTML = '<div class="note">Bu kapılar nakordoni\'de bulunamadı.</div>'; return; }
      const cells = [];
      for (const g of gates.slice(0, 3)) {
        try { const q = carPart(data(await api('v1/data/queue', 'ppid=' + g.ppid))).part; const m = waitOf(q); g.wait = m; cells.push([g.label, fmtMin(m), level(m)[1]]); }
        catch (e) { cells.push([g.label, '—', 'veri yok']); }
      }
      if (document.getElementById('heroBody') !== box) return;
      box.innerHTML = '<div class="gates">' + cells.map(c => '<div class="g"><b>' + esc(c[0]) + '</b><div class="m">' + esc(c[1]) + '</div><div class="s">' + esc(c[2]) + '</div></div>').join('') + '</div>';
    } catch (e) {
      if (document.getElementById('heroBody') !== box) return;
      box.innerHTML = '<div class="note">' + (e.kind === 'country'
        ? '⏳ Kapı verileri, nakordoni Bulgaristan/Yunanistan onayını verince burada görünecek.'
        : esc(e.message)) + '</div>';
    }
  }

  // ============ KAPILAR ============
  PAGES.gates = {
    title: 'Sınır kapıları',
    async render() {
      view.innerHTML = '<div class="card">' + skel(3) + '</div>';
      let gates;
      try { gates = await findGates(); }
      catch (e) { view.innerHTML = '<div class="card">' + errBox(e) + '</div>' + footer; bindFooter(); return; }
      view.innerHTML = gates.map(g => '<div class="card" id="g-' + g.ppid + '">' + skel(1) + '</div>').join('') + footer; bindFooter();
      for (const g of gates) gateCard(g);
    }
  };
  async function gateCard(g) {
    const el = document.getElementById('g-' + g.ppid); if (!el) return;
    let m = g.wait, len, upd;
    try {
      const cp = carPart(data(await api('v1/data/queue', 'ppid=' + g.ppid)));
      const q = cp.part; g.carOnly = cp.car;
      m = waitOf(q); len = pick(q, [/queue_?len/i, /^queue$/i, /cars|vehicles|count/i]); upd = pick(q, [/updated|last_?update|timestamp/i]);
    } catch (e) { el.innerHTML = '<div class="t">' + esc(g.label) + '</div>' + errBox(e); return; }
    const [cls, word] = level(m);
    el.innerHTML =
      '<div class="row"><div class="grow"><div class="h2">' + esc(g.label) + '</div>' +
      '<div class="muted">' + (len != null ? 'Kuyrukta ' + esc(len) + (g.carOnly ? ' otomobil' : ' araç') : '') + (upd ? ' · ' + new Date(upd).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '') + '</div></div>' +
      '<span class="pill ' + cls + '">' + word + '</span></div>' +
      '<div class="big" style="margin:8px 0 4px">' + fmtMin(m) + '</div><div class="muted">tahmini bekleme · ' + (g.carOnly ? '🚗 binek araç' : 'tüm araçlar') + '</div>' +
      '<div class="chips" style="margin-top:12px"><button class="chip" data-a="fc">📈 Sonraki 24 saat</button><button class="chip" data-a="best">🕐 En iyi saat</button><button class="chip" data-a="wx">🌦 Hava</button></div>' +
      '<div class="extra"></div>';
    el.querySelectorAll('.chip').forEach(c => c.onclick = () => {
      el.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
      gateExtra(g, c.dataset.a, el.querySelector('.extra'));
    });
  }
  function numSeries(o) {
    let s = null;
    walk(o, x => { if (s) return; for (const v of Object.values(x)) if (Array.isArray(v) && v.length >= 6) {
      const n = v.map(i => typeof i === 'number' ? i : i && typeof i === 'object' ? +(i.wait_minutes ?? i.wait ?? i.value ?? i.queue ?? i.avg ?? i.load ?? NaN) : NaN);
      if (n.filter(Number.isFinite).length >= v.length * .8) { s = n; return; } } });
    return s;
  }
  async function gateExtra(g, a, box) {
    box.innerHTML = skel(1);
    try {
      if (a === 'wx') {
        const d = data(await api('v1/data/weather', 'ppid=' + g.ppid + '&lang=en'));
        const t = pick(d, [/^temp/i, /temperature/i]); const desc = pick(d, [/desc|condition|summary/i]); const wind = pick(d, [/wind/i]);
        box.innerHTML = '<div class="row" style="margin-top:12px"><div class="big">' + (t != null ? Math.round(t) + '°' : '—') + '</div><div class="muted">' + esc(desc || '') + (wind != null ? '<br>Rüzgâr: ' + esc(wind) : '') + '</div></div>';
        return;
      }
      const d = data(a === 'fc' ? await api('v1/data/forecast', 'ppid=' + g.ppid + '&prediction_steps=24') : await api('v1/data/day-stats', 'ppid=' + g.ppid + '&lang=en'));
      const s = numSeries(carPart(d).part) || numSeries(d);
      if (!s) { box.innerHTML = '<div class="muted" style="margin-top:12px">Grafik için yeterli veri yok.</div>'; return; }
      const max = Math.max(...s.filter(Number.isFinite), 1), min = Math.min(...s.filter(Number.isFinite));
      const lowIdx = s.indexOf(min);
      box.innerHTML = '<div class="bars">' + s.map((n, i) => '<div class="' + (i === lowIdx ? 'low' : '') + '" style="height:' + Math.max(3, n / max * 100) + '%"></div>').join('') + '</div>' +
        '<div class="axis"><span>' + (a === 'fc' ? 'şimdi' : 'başlangıç') + '</span><span>' + (a === 'fc' ? '+24 sa' : 'son') + '</span></div>' +
        '<div class="muted" style="margin-top:8px">🟢 En sakin an: ' + (a === 'fc' ? (lowIdx === 0 ? 'şimdi' : lowIdx + ' saat sonra') : (lowIdx + 1) + '. dilim') + ' (~' + fmtMin(min) + ')</div>';
    } catch (e) { box.innerHTML = '<div style="margin-top:12px">' + errBox(e) + '</div>'; }
  }

  // ============ DÖVİZ ============
  PAGES.fx = {
    title: 'Döviz',
    async render() {
      view.innerHTML = '<div class="card">' + skel(4) + '</div>';
      try {
        const d = data(await api('v1/data/currency'));
        const rates = d.rates || {};
        const NAMES = { USD: 'ABD Doları', GBP: 'İngiliz Sterlini', CHF: 'İsviçre Frangı', PLN: 'Polonya Zlotisi', CZK: 'Çek Korunası', HUF: 'Macar Forinti', RON: 'Rumen Leyi', NOK: 'Norveç Kronu', UAH: 'Ukrayna Grivnası', BGN: 'Bulgar Levası', TRY: 'Türk Lirası', RSD: 'Sırp Dinarı' };
        const codes = Object.keys(rates).filter(c => c !== 'EUR');
        view.innerHTML =
          '<div class="card"><div class="muted">1 Euro karşılığı · ' + (d.date ? trDate(d.date, { day: 'numeric', month: 'long' }) : '') + '</div>' +
          '<div class="conv" style="margin-top:12px"><input id="amt" type="number" inputmode="decimal" value="100"><b>EUR</b></div></div>' +
          '<div class="card list">' + codes.map(c => '<div class="it"><div class="badge">' + c + '</div><div class="grow"><div class="t">' + esc(NAMES[c] || c) + '</div><div class="s">1 EUR = ' + (+rates[c]).toLocaleString('tr-TR', { maximumFractionDigits: 4 }) + ' ' + c + '</div></div><b data-r="' + rates[c] + '">—</b></div>').join('') + '</div>' +
          '<div class="muted" style="text-align:center">Türk lirası bu kaynakta yok.</div>' + footer;
        const upd = () => { const a = parseFloat(document.getElementById('amt').value) || 0; view.querySelectorAll('b[data-r]').forEach(b => b.textContent = (a * +b.dataset.r).toLocaleString('tr-TR', { maximumFractionDigits: 2 })); };
        document.getElementById('amt').oninput = upd; upd(); bindFooter();
      } catch (e) { view.innerHTML = '<div class="card">' + errBox(e) + '</div>' + footer; bindFooter(); }
    }
  };

  // ============ TATİLLER ============
  const COUNTRIES = [['TR', '🇹🇷 Türkiye'], ['BG', '🇧🇬 Bulgaristan'], ['GR', '🇬🇷 Yunanistan'], ['RS', '🇷🇸 Sırbistan']];
  const chips = (sel, id) => '<div class="chips" id="' + id + '">' + COUNTRIES.map(([c, l]) => '<button class="chip' + (c === sel ? ' on' : '') + '" data-c="' + c + '">' + l + '</button>').join('') + '</div>';
  function countryPage(title, renderFn) {
    return { title, render() {
      let cur = 'TR';
      view.innerHTML = chips(cur, 'cc') + '<div id="out"></div>' + footer; bindFooter();
      const load = async () => { const out = document.getElementById('out'); out.innerHTML = '<div class="card">' + skel(4) + '</div>'; try { out.innerHTML = await renderFn(cur); } catch (e) { out.innerHTML = '<div class="card">' + errBox(e) + '</div>'; } };
      document.getElementById('cc').onclick = ev => { const b = ev.target.closest('.chip'); if (!b) return; cur = b.dataset.c; document.querySelectorAll('#cc .chip').forEach(x => x.classList.toggle('on', x === b)); load(); };
      load();
    } };
  }
  PAGES.holidays = countryPage('Resmi tatiller', async c => {
    const y = new Date().getFullYear();
    let list = mainArray(data(await api('v2/data/holiday-calendar/holidays', 'country=' + c + '&year=' + y + '&lang=tr')));
    if (!list.length) return '<div class="card muted">Bu yıl için tatil bulunamadı.</div>';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    list = list.map(h => ({ h, iso: isoIn(h) })).filter(x => x.iso).sort((a, b) => a.iso.localeCompare(b.iso));
    const next = list.find(x => new Date(x.iso.slice(0, 10) + 'T12:00:00') >= today);
    const days = next ? Math.round((new Date(next.iso.slice(0, 10) + 'T12:00:00') - today) / 864e5) : null;
    return (next ? '<div class="card"><div class="muted">Sıradaki tatil</div><div class="h2">' + esc(nameOf(next.h)) + '</div><div class="muted">' + trDate(next.iso) + '</div><div class="big" style="margin-top:6px">' + (days === 0 ? 'Bugün' : days + ' gün') + '</div></div>' : '') +
      '<div class="card list">' + list.map(({ h, iso }) => {
        const d = new Date(iso.slice(0, 10) + 'T12:00:00'), past = d < today;
        return '<div class="it" style="' + (past ? 'opacity:.45' : '') + '"><div class="badge">' + d.getDate() + '<small>' + d.toLocaleDateString('tr-TR', { month: 'short' }) + '</small></div><div class="grow"><div class="t">' + esc(nameOf(h)) + '</div><div class="s">' + d.toLocaleDateString('tr-TR', { weekday: 'long' }) + '</div></div></div>';
      }).join('') + '</div>';
  });

  // ============ AKARYAKIT ============
  PAGES.fuel = countryPage('Akaryakıt', async c => {
    const d = data(await api('v1/data/fuel', 'country=' + c));
    const arr = mainArray(d);
    if (arr.length) return '<div class="card list">' + arr.slice(0, 40).map(r => {
      const p = pick(r, [/^price/i, /eur|value|avg/i]); const cur = pick(r, [/currency/i]) || '';
      return '<div class="it"><div class="grow"><div class="t">' + esc(nameOf(r) || pick(r, [/fuel|type|grade/i]) || '') + '</div><div class="s">' + esc(pick(r, [/updated|date/i]) || '') + '</div></div><b>' + (p != null ? (+p).toLocaleString('tr-TR', { maximumFractionDigits: 3 }) + ' ' + esc(cur) : '—') + '</b></div>';
    }).join('') + '</div>';
    // dizi yoksa düz anahtar → fiyat
    const flat = []; walk(d, o => { for (const [k, v] of Object.entries(o)) if (typeof v === 'number' && /diesel|petrol|gasoline|lpg|95|98|benzin/i.test(k)) flat.push([k, v]); });
    if (!flat.length) return '<div class="card muted">Bu ülke için fiyat bulunamadı.</div>';
    const L = { diesel: 'Motorin', petrol: 'Benzin', gasoline: 'Benzin', lpg: 'LPG' };
    return '<div class="card list">' + flat.map(([k, v]) => '<div class="it"><div class="grow"><div class="t">' + esc(L[k.toLowerCase()] || k.replace(/_/g, ' ')) + '</div></div><b>' + v.toLocaleString('tr-TR', { maximumFractionDigits: 3 }) + '</b></div>').join('') + '</div>';
  });

  // ============ VİNYET VE OTOYOL ============
  PAGES.tolls = countryPage('Vinyet ve otoyol', async c => {
    const d = data(await api('v2/data/vignettes', 'country=' + c));
    let arr = mainArray(d);
    const isCar = r => { const t = JSON.stringify(r); return /car|passenger|m1|kategori b|legkov|легков/i.test(t) || !NONCAR_RE.test(t); };
    const cars = arr.filter(isCar); if (cars.length) arr = cars;
    if (!arr.length) {
      const note = pick(d, [/desc|note|info|text|summary/i]);
      return '<div class="card">' + (note ? esc(note) : '<span class="muted">Bu ülke için vinyet bilgisi bulunamadı.</span>') + '</div>';
    }
    return '<div class="card"><div class="muted">🚗 Binek araç için</div><div class="list">' + arr.slice(0, 30).map(r => {
      const price = pick(r, [/^price/i, /cost|amount|fee|eur/i]); const cur = pick(r, [/currency/i]) || '';
      const dur = pick(r, [/duration|period|valid|days/i]); const nm = nameOf(r) || pick(r, [/type|kind|product/i]) || 'Vinyet';
      const url = pick(r, [/url|link|buy/i]);
      return '<div class="it"><div class="grow"><div class="t">' + esc(nm) + '</div><div class="s">' + esc(dur != null ? (/^\d+$/.test(String(dur)) ? dur + ' gün' : dur) : '') +
        (url && /^https?:/.test(url) ? ' · <a href="' + esc(url) + '" target="_blank" rel="noopener">satın al</a>' : '') + '</div></div><b>' +
        (price != null ? (isNaN(+price) ? esc(price) : (+price).toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ' + esc(cur)) : '') + '</b></div>';
    }).join('') + '</div></div>';
  });

  // ============ ASİSTAN ============
  PAGES.ask = {
    title: 'Asistana sor',
    render() {
      view.innerHTML = '<div id="chat"><div class="bubble">Merhaba! Sınır geçişi, bekleme süreleri, belgeler ya da yol hakkında sorabilirsin.</div></div>' +
        '<div class="chips" id="sug"><button class="chip">Kapıkule\'de bekleme ne kadar?</button><button class="chip">Bulgaristan\'a girişte hangi belgeler lazım?</button><button class="chip">Arabayla Bulgaristan vinyeti nasıl alınır?</button><button class="chip">Yeşil kart sigortası gerekli mi?</button></div>' +
        '<div class="card" style="position:sticky;bottom:10px"><div class="conv"><input id="q" placeholder="Sorunu yaz…"><button class="btn acc" id="send" style="width:auto">Sor</button></div></div>' + footer;
      bindFooter();
      const send = async (text) => {
        const q = (text || document.getElementById('q').value).trim(); if (!q) return;
        document.getElementById('q').value = '';
        const chat = document.getElementById('chat');
        chat.insertAdjacentHTML('beforeend', '<div class="bubble me">' + esc(q) + '</div><div class="bubble" id="pending">…</div>');
        const p = document.getElementById('pending'); p.removeAttribute('id');
        try {
          const d = data(await api('v1/data/assistant', 'q=' + encodeURIComponent(q + ' (binek araçla seyahat ediyorum)') + '&lang=tr' + (S.gates[0] ? '&ppid=' + S.gates[0].ppid : '')));
          p.textContent = typeof d === 'string' ? d : (pick(d, [/^answer$/i, /^reply$/i, /^text$/i, /^message$/i, /response|content/i]) || 'Cevap alınamadı.');
        } catch (e) { p.innerHTML = esc(e.message); }
        p.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      document.getElementById('send').onclick = () => send();
      document.getElementById('q').onkeydown = e => { if (e.key === 'Enter') send(); };
      document.getElementById('sug').onclick = e => { const b = e.target.closest('.chip'); if (b) send(b.textContent); };
    }
  };

  // ============ AYARLAR ============
  PAGES.settings = {
    title: 'Ayarlar',
    render() {
      view.innerHTML = '<div class="card"><div class="t">Sunucu adresi</div><div class="muted" style="margin:4px 0 10px">Genelde değiştirmen gerekmez.</div>' +
        '<input id="url" value="' + esc(S.url) + '"' + (onWorker ? ' disabled' : '') + '>' +
        '<div style="margin-top:12px;display:grid;gap:8px"><button class="btn" id="save">Kaydet</button><button class="btn ghost" id="test">Bağlantıyı test et</button></div><div id="tout" class="muted" style="margin-top:10px"></div></div>' +
        '<div class="card"><div class="t">Kota</div><div id="usage" class="muted" style="margin-top:6px">…</div></div>' + footer;
      bindFooter();
      document.getElementById('save').onclick = () => { S.url = document.getElementById('url').value.trim() || S.url; store.set('hk_url', S.url); S.gates = []; go('home'); };
      document.getElementById('test').onclick = async () => {
        const o = document.getElementById('tout'); o.textContent = 'deneniyor…';
        try { const s = data(await api('v1/data/status')).summary; o.textContent = '✅ Bağlı' + (s ? ' · ' + s.online + '/' + s.total + ' servis çalışıyor' : ''); } catch (e) { o.textContent = '❌ ' + e.message; }
      };
      api('v2/account/usage').then(b => {
        const u = b.usage || data(b); const used = pick(u, [/^used$/i]), lim = pick(u, [/^limit$/i]);
        document.getElementById('usage').textContent = used != null ? 'Bugün ' + used + ' / ' + lim + ' sorgu kullanıldı. Gece 03:00\'te sıfırlanır.' : 'Bilgi alınamadı.';
      }).catch(e => { const el = document.getElementById('usage'); if (el) el.textContent = e.message; });
    }
  };

  const SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  go(location.hash.slice(1) || 'home', false);
  history.replaceState({ p: location.hash.slice(1) || 'home' }, '');
})();
</script>
</body>
</html>
